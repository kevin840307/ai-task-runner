stages:
  discussion:
    type: discussion_controller
    label: Discussion Board
    status: AI 正在協調多 Session 專業討論
    targets:
      - requirements_analyst
      - solution_architect
      - domain_specialist
      - risk_reviewer
      - evidence_verifier
      - moderator
      - judge
    round_end: judge
    max_rounds: 3
    error_policy:
      retries: -1

  requirements_analyst:
    type: discussion
    controller: discussion
    label: Requirements Analyst
    role: requirements_analyst
    status: Requirements Analyst 正在釐清目標、限制與驗收條件
    instructions: Identify goals, constraints, assumptions, ambiguities, and measurable acceptance criteria. Surface missing requirements before solution discussion.
    session_key: discussion_requirements_analyst
    error_policy:
      retries: -1
    routes:
      pass: discussion

  solution_architect:
    type: discussion
    controller: discussion
    label: Solution Architect
    role: solution_architect
    status: Solution Architect 正在評估架構、邊界與整體方案
    instructions: Evaluate architecture, component boundaries, integration choices, tradeoffs, maintainability, and the smallest viable design that satisfies the Goal.
    session_key: discussion_solution_architect
    error_policy:
      retries: -1
    routes:
      pass: discussion

  domain_specialist:
    type: discussion
    controller: discussion
    label: Domain Specialist
    role: domain_specialist
    status: Domain Specialist 正在補充領域知識與情境限制
    instructions: Validate domain assumptions, business or technical semantics, edge cases, operational context, and constraints the other roles may overlook.
    session_key: discussion_domain_specialist
    error_policy:
      retries: -1
    routes:
      pass: discussion

  risk_reviewer:
    type: discussion
    controller: discussion
    label: Risk & Quality Reviewer
    role: risk_quality_reviewer
    status: Risk Reviewer 正在檢查風險、品質與失敗模式
    instructions: Challenge the proposal for correctness, reliability, security, maintainability, failure modes, hidden coupling, and operational risk. Prioritize material risks only.
    session_key: discussion_risk_reviewer
    error_policy:
      retries: -1
    routes:
      pass: discussion

  evidence_verifier:
    type: discussion
    controller: discussion
    label: Evidence Verifier
    role: evidence_verifier
    status: Evidence Verifier 正在確認證據、假設與可驗證性
    instructions: Separate facts from assumptions, request decisive evidence, define practical verification, and identify claims that are not yet sufficiently supported.
    session_key: discussion_evidence_verifier
    error_policy:
      retries: -1
    routes:
      pass: discussion

  moderator:
    type: discussion
    controller: discussion
    label: Discussion Moderator
    role: moderator
    status: Moderator 正在整合觀點、衝突與待確認事項
    instructions: Synthesize agreements, disagreements, decisions, and unresolved questions without introducing a new competing solution. Prepare a concise decision-ready summary.
    session_key: discussion_moderator
    error_policy:
      retries: -1
    routes:
      pass: discussion

  judge:
    type: review
    label: Decision Judge
    status: Judge 正在判斷討論是否成熟
    prompt: common/discussion_judge.md
    session_key: discussion_judge
    readonly_safety: observe
    error_policy:
      retries: -1
    routes:
      pass: final_validate
      fail: discussion

  final_validate:
    type: ai_validator
    validator: ai
    label: Independent Final Validator
    status: Final AI Validation 正在獨立確認最終結果
    prompt: common/discussion_final_validator.md
    readonly_safety: observe
    error_policy:
      retries: -1
    routes:
      pass: done
      fail: discussion

flow:
  - discussion
  - requirements_analyst
  - solution_architect
  - domain_specialist
  - risk_reviewer
  - evidence_verifier
  - moderator
  - judge
  - final_validate

stages:
  planning:
    type: plan
    # Plan owns the built-in per-TODO lifecycle:
    # Task -> Review -> Repair(on fail) -> Review.
    # Completes only after all TODOs pass.

  repair_plan:
    type: plan
    status: AI 正在建立修復規劃
    repair_plan: true
    fresh_session_on_start: true

  validate_file:
    type: command
    status: 正在執行 File Validator
    run_state: validating
    actor: validator
    result_kind: validation
    command: "{python} {validator} --project-root {project_root} --state-file {state_file} {validator_args}"
    recover: [repair_plan]

flow:
  - planning
  - validate_file

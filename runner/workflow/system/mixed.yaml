stages:
  planning:
    type: plan
    status: AI 正在依任務複雜度建立可驗證 TODO
    readonly_safety: observe
    routes:
      replan: planning
      error: stop


  validate_file:
    type: command
    status: 正在執行 Python Validator
    run_state: validating
    actor: validator
    result_kind: validation
    command: "{python} {validator} --project-root {project_root} --state-file {state_file} {validator_args}"
    routes:
      fail: planning

  validate_ai:
    type: ai_validator
    status: AI 正在執行最終語意驗證
    validator: ai
    fresh_session_each_run: true
    runs: 3
    required_passes: 2
    ai_validator_yolo: true
    readonly_safety: observe
    routes:
      fail: planning

flow:
  - planning
  - validate_file
  - validate_ai

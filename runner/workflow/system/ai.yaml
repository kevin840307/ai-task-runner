stages:
  planning:
    type: plan
    # Plan owns the built-in per-TODO lifecycle:
    # Task -> Review -> Repair(on fail) -> Review.
    # Completes only after all TODOs pass.

  repair_plan:
    type: plan
    status: AI 正在建立修復規劃
    repair_plan: true
    fresh_session_on_start: true

  validate_ai:
    type: ai_validator
    validator: ai
    recover: [repair_plan]

flow:
  - planning
  - validate_ai

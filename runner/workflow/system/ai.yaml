stages:
  planning:
    type: plan
    status: AI 正在依任務複雜度建立可驗證 TODO

  repair_plan:
    type: plan
    status: AI 正在針對驗證缺口建立最小修復規劃
    repair_plan: true
    fresh_session_on_start: true

  validate_ai:
    type: ai_validator
    status: AI 正在執行最終語意驗證
    validator: ai
    fresh_session_each_run: true
    recover: [repair_plan]

flow:
  - planning
  - validate_ai

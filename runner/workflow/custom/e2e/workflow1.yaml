stages:
  preflight:
    type: command
    command: ['{python}', -B, '{runner_root}/runner/workflow/custom/e2e/python/blueprint_preflight.py']

  gate_preflight:
    type: command
    command: ['{python}', -B, '{runner_root}/runner/workflow/custom/e2e/python/blueprint_stage_validation.py', --stage, preflight, --state, '{state_file}']

  planning:
    type: plan
    min_tasks: 1
    fresh_session_on_start: true
    status: AI 正在依需求與可用材料規劃 E2E Blueprint TODO

  gate_planning:
    type: command
    command: ['{python}', -B, '{runner_root}/runner/workflow/custom/e2e/python/blueprint_stage_validation.py', --stage, planning, --state, '{state_file}']

  execute:
    type: task
    prompt: ../../../prompts/custom/e2e/blueprint_execute.md
    retry: -1
    fresh_session_on_start: true

  gate_execute:
    type: command
    command: ['{python}', -B, '{runner_root}/runner/workflow/custom/e2e/python/blueprint_stage_validation.py', --stage, execute, --state, '{state_file}']

  repair:
    type: base
    mode: write
    actor: executor
    prompt: stages/workflow_prompt.md
    track_changes: true
    retry: -1
    instructions: >-
      Repair only the concrete current E2E Blueprint finding from Execute, Review, Grill,
      Final Validation, or Final AI. Inspect result/blueprint/export plus only the smallest
      relevant project/material subset. Preserve valid work and the canonical schema;
      never weaken Python Gates or protected inputs. For large/multi-project workspaces,
      trace only modules needed for the defect; optional subagents may investigate
      independent modules/services when the backend supports delegation.

  gate_repair:
    type: command
    command: ['{python}', -B, '{runner_root}/runner/workflow/custom/e2e/python/blueprint_stage_validation.py', --stage, execute, --state, '{state_file}']

  review:
    type: review
    prompt: stages/workflow_review.md
    skip_on_error: false
    structured_retries: 2
    runs: 2
    required_passes: 2
    fresh_session_each_run: true
    instructions: >-
      Review the COMPLETE E2E Blueprint after all TODOs finish. Check only concrete
      blocking defects in business-flow coverage, important boundaries/branches,
      Flow-to-Case consistency, observable oracles, evidence support, and unsupported
      assumptions. Do not require repository-wide static inventory or theoretical completeness.

  gate_review:
    type: command
    command: ['{python}', -B, '{runner_root}/runner/workflow/custom/e2e/python/blueprint_stage_validation.py', --stage, review, --state, '{state_file}']

  grill:
    type: review
    prompt: stages/workflow_review.md
    skip_on_error: false
    structured_retries: 2
    retry: 0
    fresh_session_on_start: true
    instructions: >-
      Adversarially challenge the COMPLETE E2E Blueprint after Review. Fail only for
      evidence-backed MAJOR/CRITICAL omissions or contradictions that materially weaken
      an E2E flow, failure/retry/async/idempotency behavior, boundary, oracle, or evidence claim.
      Do not invent missing items; PASS when no concrete blocking defect remains.

  gate_grill:
    type: command
    command: ['{python}', -B, '{runner_root}/runner/workflow/custom/e2e/python/blueprint_stage_validation.py', --stage, grill, --state, '{state_file}']

  validate_contract:
    type: command
    command: ['{python}', -B, '{runner_root}/runner/workflow/custom/e2e/python/blueprint_validation.py', --check, contract, --state-file, '{state_file}']
    result_kind: validation
    timeout: 1200

  validate_traceability:
    type: command
    command: ['{python}', -B, '{runner_root}/runner/workflow/custom/e2e/python/blueprint_validation.py', --check, traceability, --state-file, '{state_file}']
    result_kind: validation
    timeout: 1200

  validate_quality:
    type: command
    command: ['{python}', -B, '{runner_root}/runner/workflow/custom/e2e/python/blueprint_validation.py', --check, quality, --state-file, '{state_file}']
    result_kind: validation
    timeout: 1200

  export_e2e_spec:
    type: command
    command: ['{python}', -B, '{runner_root}/runner/workflow/custom/e2e/python/export_e2e_spec.py', --workflow, workflow1]

  final_ai:
    type: ai_validator
    validator: ai
    runs: 3
    required_passes: 2
    fresh_session_each_run: true
    allow_project_read: true
    instructions: >-
      Start from result/system/workflow1/final_ai_context.yaml. Reject only concrete
      MAJOR/CRITICAL semantic defects in business-flow coverage, Flow/Case consistency,
      observable oracles, evidence support, or materially wrong boundaries/branches.
      Do not require static-analysis inventories, code coverage, fixed case counts, or
      speculative completeness. Clearly labeled ASSUMPTION items are acceptable.

flow:
  - {stage: preflight, label: Discover Request + Available Evidence}
  - {stage: gate_preflight, label: Python Gate · Preflight}
  - {stage: planning, label: Plan Business-Flow TODOs}

  # Single contiguous task block: generate ALL TODOs first, then global Review/Grill.
  - {stage: gate_planning, label: Python Gate · Planning, scope: task}
  - {stage: execute, label: Discover / Design Current E2E Flow, scope: task}
  - stage: gate_execute
    label: Python Gate · Execute
    scope: task
    recover:
      - {stage: repair, label: Repair Current Execute Finding}
      - {stage: gate_repair, label: Python Gate · Execute Repair}

  - stage: review
    label: Review Complete Blueprint · 2/2 PASS
    recover: &repair_flow
      - {stage: repair, label: Repair Current Blueprint Finding}
      - {stage: gate_repair, label: Python Gate · Repair}
  - {stage: gate_review, label: Python Gate · Review, recover: *repair_flow}

  - stage: grill
    label: Grill Complete Blueprint · 最多 3 輪
    recover: *repair_flow
    max_attempts: 3
    on_exhausted: continue
  - {stage: gate_grill, label: Python Gate · Grill, recover: *repair_flow}

  - stage: validate_contract
    label: Validation 1/3 · Blueprint Contract
    recover: *repair_flow

  - stage: validate_traceability
    label: Validation 2/3 · Flow / Case / Evidence Traceability
    recover:
      - {stage: repair, label: Repair Traceability Finding}
      - {stage: gate_repair, label: Python Gate · Repair}
      - {stage: validate_contract, label: Re-Validate Blueprint Contract}

  - stage: validate_quality
    label: Validation 3/3 · Oracle / Evidence / Assumption Quality
    recover:
      - {stage: repair, label: Repair Quality Finding}
      - {stage: gate_repair, label: Python Gate · Repair}
      - {stage: validate_contract, label: Re-Validate Blueprint Contract}
      - {stage: validate_traceability, label: Re-Validate Traceability}

  - {stage: export_e2e_spec, label: Export YAML → result/E2E_SPEC.md}
  - stage: final_ai
    label: Final Fresh AI Semantic Challenge · 2/3 PASS
    recover:
      - {stage: repair, label: Repair Final Semantic Finding}
      - {stage: gate_repair, label: Python Gate · Final Semantic Repair}
      - {stage: validate_contract, label: Re-Validate Blueprint Contract}
      - {stage: validate_traceability, label: Re-Validate Traceability}
      - {stage: validate_quality, label: Re-Validate Quality}
      - {stage: export_e2e_spec, label: Re-Export result/E2E_SPEC.md}

stages:
  inventory_source:
    type: command
    command: ['{python}', -B, '{runner_root}/runner/workflow/custom/e2e/python/scan_source_inventory.py', --project-root, '{project_root}']
    result_kind: validation
    timeout: 1200

  discover_flows:
    type: base
    mode: write
    actor: executor
    prompt: custom/e2e/flow_discovery.md
    track_changes: true
    retry: -1
    fresh_session_on_start: true
    status: AI 正在探索可證明的 Business E2E Flow

  repair_flows:
    type: base
    mode: write
    actor: executor
    prompt: custom/e2e/repair_flows.md
    track_changes: true
    retry: -1
    fresh_session_on_start: true
    status: AI 正在依 Grill / Review / Python finding 修正 Flow

  grill_flows:
    type: review
    prompt: custom/e2e/grill_flows.md
    skip_on_error: false
    structured_retries: 2
    fresh_session_on_start: true
    status: AI 正在對 Business Flow 做證據式 Grill

  review_flows:
    type: review
    prompt: custom/e2e/review_flows.md
    skip_on_error: false
    structured_retries: 2
    fresh_session_on_start: true
    status: AI 正在裁決 Flow 與 Grill findings

  gate_flows:
    type: command
    command: ['{python}', -B, '{runner_root}/runner/workflow/custom/e2e/python/validate_flow_discovery.py', --project-root, '{project_root}']
    result_kind: validation
    timeout: 1200

  generate_cases:
    type: base
    mode: write
    actor: executor
    prompt: custom/e2e/case_generation.md
    track_changes: true
    retry: -1
    fresh_session_on_start: true
    status: AI 正在由已驗證 Flow 生成 E2E Cases

  repair_cases:
    type: base
    mode: write
    actor: executor
    prompt: custom/e2e/repair_cases.md
    track_changes: true
    retry: -1
    fresh_session_on_start: true
    status: AI 正在依 findings 修正 E2E Cases

  grill_cases:
    type: review
    prompt: custom/e2e/grill_cases.md
    skip_on_error: false
    structured_retries: 2
    fresh_session_on_start: true
    status: AI 正在對 E2E Cases 做證據式 Grill

  review_cases:
    type: review
    prompt: custom/e2e/review_cases.md
    skip_on_error: false
    structured_retries: 2
    fresh_session_on_start: true
    status: AI 正在裁決 Case 與 Grill findings

  gate_cases:
    type: command
    command: ['{python}', -B, '{runner_root}/runner/workflow/custom/e2e/python/validate_e2e_cases.py', --project-root, '{project_root}']
    result_kind: validation
    timeout: 1200

  consolidate_spec:
    type: base
    mode: write
    actor: executor
    prompt: custom/e2e/final_consolidation.md
    track_changes: true
    retry: -1
    fresh_session_on_start: true
    status: AI 正在整併最終 E2E SPEC

  repair_final:
    type: base
    mode: write
    actor: executor
    prompt: custom/e2e/repair_final.md
    track_changes: true
    retry: -1
    fresh_session_on_start: true
    status: AI 正在修正最終 E2E SPEC

  grill_final:
    type: review
    prompt: custom/e2e/grill_final.md
    skip_on_error: false
    structured_retries: 2
    fresh_session_on_start: true
    status: AI 正在從全域角度 Grill 最終 E2E SPEC

  review_final:
    type: review
    prompt: custom/e2e/review_final.md
    skip_on_error: false
    structured_retries: 2
    fresh_session_on_start: true
    status: AI 正在做最終語意裁決

  gate_final:
    type: command
    command: ['{python}', -B, '{runner_root}/runner/workflow/custom/e2e/python/validate_final_spec.py', --project-root, '{project_root}']
    result_kind: validation
    timeout: 1200

  render_markdown:
    type: command
    command: ['{python}', -B, '{runner_root}/runner/workflow/custom/e2e/python/render_e2e_spec.py', --project-root, '{project_root}']
    timeout: 1200

flow:
  - {stage: inventory_source, label: 1/3 · Python Inventory · Projects / Entrypoints / SQL / Parameters}
  - {stage: discover_flows, label: 1/3 · Discover Business E2E Flows}

  - stage: grill_flows
    label: 1/3 · Grill Flow · 最多 3 次，耗盡後 Skip
    recover: &repair_flow
      - {stage: repair_flows, label: Repair Flow Finding}
    max_attempts: 3
    on_exhausted: continue

  - stage: review_flows
    label: 1/3 · Review Flow
    recover: *repair_flow
    max_attempts: 3
    on_exhausted: fail

  - stage: gate_flows
    label: 1/3 · Python Gate · Evidence / Flow Contract
    recover: *repair_flow
    max_attempts: 3
    on_exhausted: fail

  - {stage: generate_cases, label: 2/3 · Generate E2E Cases from Verified Flows}

  - stage: grill_cases
    label: 2/3 · Grill Cases · 最多 3 次，耗盡後 Skip
    recover: &repair_case
      - {stage: repair_cases, label: Repair Case Finding}
    max_attempts: 3
    on_exhausted: continue

  - stage: review_cases
    label: 2/3 · Review Cases
    recover: *repair_case
    max_attempts: 3
    on_exhausted: fail

  - stage: gate_cases
    label: 2/3 · Python Gate · Case / Traceability Contract
    recover: *repair_case
    max_attempts: 3
    on_exhausted: fail

  - {stage: consolidate_spec, label: 3/3 · Consolidate Final E2E SPEC}

  - stage: grill_final
    label: 3/3 · Grill Final SPEC · 最多 3 次，耗盡後 Skip
    recover: &repair_final_flow
      - {stage: repair_final, label: Repair Final Finding}
    max_attempts: 3
    on_exhausted: continue

  - stage: review_final
    label: 3/3 · Review Final SPEC
    recover: *repair_final_flow
    max_attempts: 3
    on_exhausted: fail

  - stage: gate_final
    label: 3/3 · Python Final Gate
    recover: *repair_final_flow
    max_attempts: 3
    on_exhausted: fail

  - {stage: render_markdown, label: Render e2e_spec.yaml → e2e_spec.md}

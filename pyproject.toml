[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-task-runner"
version = "1.2.33"
description = "Small retry/review/validator loop around coding agents."
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "Jinja2>=3.1",
]

[tool.setuptools]
packages = [
    "runner",
    "runner.model",
    "runner.prompts",
    "runner.prompts.stages",
    "runner.prompts.system",
    "runner.backends",
    "runner.config",
    "runner.extensions",
    "runner.flow",
    "runner.runtime",
    "runner.flow.stages",
    "runner.utils",
]
py-modules = [
    "ai_task_runner",
    "ai_task_runner_validator",
]

[tool.setuptools.package-data]
"runner.prompts.stages" = ["*.md"]
"runner.prompts.system" = ["*.md"]

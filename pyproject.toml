[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-task-runner"
version = "1.2.17"
description = "Small retry/review/validator loop around coding agents."
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "Jinja2>=3.1",
]

[tool.setuptools]
packages = [
    "runner",
    "runner.app",
    "runner.engine",
    "runner.config",
    "runner.runtime",
    "runner.agent",
    "runner.agent.prompt_templates",
    "runner.backends",
    "runner.safety",
    "runner.workflow",
    "runner.workflow.validation",
]
py-modules = [
    "ai_task_runner",
    "ai_task_runner_validator",
]

[tool.setuptools.package-data]
"runner.agent.prompt_templates" = ["*.md"]

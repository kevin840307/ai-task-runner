[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-task-runner"
dynamic = ["version"]
description = "Minimal durable closed-loop workflow runner for coding agents."
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "Jinja2>=3.1",
]

[tool.setuptools]
packages = [
    "runner",
    "runner.agent",
    "runner.assets",
    "runner.config",
    "runner.plugins",
    "runner.runtime",
    "runner.workflow",
    "runner.workflow.stages",
    "workflow_builder",
]
py-modules = [
    "ai_task_runner",
    "ai_task_runner_validator",
]

[tool.setuptools.dynamic]
version = {attr = "runner.version.__version__"}

[tool.setuptools.package-data]
"runner.assets" = [
    "workflows/*.yaml",
    "prompts/common/*.md",
    "prompts/ralphy/*.md",
    "prompts/workflow/*.md",
]
"workflow_builder" = ["*.yaml", "*.md"]

[tool.pytest.ini_options]
pythonpath = ["."]

stages:
  work:
    status: Mock work
    mode: write
    actor: executor

  check:
    status: Mock quality check
    mode: readonly
    fresh_after_same_failures: 2
    max_results: 3
    recover: [fix]

  fix:
    status: Mock fix
    mode: write
    actor: executor

  final:
    validator: ai
    status: Mock final gate
    mode: readonly

flow:
  - work
  - check
  - final

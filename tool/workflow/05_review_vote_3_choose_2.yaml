stages:
  planning:
    type: plan

  execute:
    type: task
    scope: task

  review:
    type: review
    scope: task
    routes:
      fail: execute

  review_vote:
    type: review
    prompt: common/review.md
    session_policy: fresh
    runs: 3
    required_passes: 2
    routes:
      fail: planning

  validate_ai:
    type: ai_validator
    validator: ai
    session_policy: fresh
    routes:
      fail: planning

flow:
  - planning
  - execute
  - review
  - review_vote
  - validate_ai

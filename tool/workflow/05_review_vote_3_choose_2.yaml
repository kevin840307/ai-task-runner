stages:
  planning:
    type: plan



  review_vote:
    type: base
    profile: review
    prompt: common/review.md
    session_policy: fresh
    runs: 3
    required_passes: 2
    routes:
      fail: planning

  validate_ai:
    type: ai_validator
    validator: ai
    session_policy: fresh
    routes:
      fail: planning

flow:
  - planning
  - review_vote
  - validate_ai

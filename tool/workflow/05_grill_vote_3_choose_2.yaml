stages:
  planning:
    type: plan

  execute:
    type: task
    scope: task

  review:
    type: review
    scope: task
    routes:
      fail: execute

  grill:
    type: review
    prompt: common/grill.md
    fresh_session_on_start: true
    fresh_session_each_run: true
    runs: 3
    required_passes: 2
    routes:
      fail: planning

  validate_ai:
    type: ai_validator
    validator: ai
    routes:
      fail: planning

flow:
  - planning
  - execute
  - review
  - grill
  - validate_ai

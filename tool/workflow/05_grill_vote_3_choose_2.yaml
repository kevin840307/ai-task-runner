# Three independent Grill sessions; at least two must PASS.
# A failed Grill vote routes through the existing Planning Stage.
stages:
  planning:
    type: plan

  grill:
    type: review
    prompt: ../../runner/prompts/stages/grill.md
    fresh_session_on_start: true
    fresh_session_each_run: true
    retry: 0
    runs: 3
    required_passes: 2
    recover: [planning]

  validate_ai:
    type: ai_validator
    validator: ai
    restart_at: planning

flow:
  - planning
  - grill
  - validate_ai

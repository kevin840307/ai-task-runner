# Grill + deterministic validation + final AI validation.
# Semantic failures route back to the existing Planning Stage.
stages:
  planning:
    type: plan

  grill:
    type: review
    prompt: ../../runner/prompts/stages/grill.md
    fresh_session_on_start: true
    retry: 0
    recover: [planning]

  validate_file:
    type: command
    status: 正在執行 File Validator
    run_state: validating
    actor: validator
    result_kind: validation
    command: "{python} {validator} --project-root {project_root} --state-file {state_file} {validator_args}"
    restart_at: planning

  validate_ai:
    type: ai_validator
    validator: ai
    restart_at: planning

flow:
  - planning
  - grill
  - validate_file
  - validate_ai

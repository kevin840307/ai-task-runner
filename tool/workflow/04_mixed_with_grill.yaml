stages:
  planning:
    type: plan

  execute:
    type: task
    scope: task

  review:
    type: review
    scope: task
    routes:
      fail: execute

  grill:
    type: review
    prompt: common/grill.md
    fresh_session_on_start: true
    routes:
      fail: planning

  validate_file:
    type: command
    status: 正在執行 File Validator
    run_state: validating
    actor: validator
    result_kind: validation
    command: "{python} {validator} --project-root {project_root} --state-file {state_file} {validator_args}"
    routes:
      fail: planning

  validate_ai:
    type: ai_validator
    validator: ai
    routes:
      fail: planning

flow:
  - planning
  - execute
  - review
  - grill
  - validate_file
  - validate_ai

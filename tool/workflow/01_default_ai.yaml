stages:
  planning:
    type: plan

  execute:
    type: task

  review:
    type: review
    routes:
      fail: execute

  validate_ai:
    type: ai_validator
    validator: ai
    routes:
      fail: planning

flow:
  - planning
  - stage: execute
    scope: task
  - stage: review
    scope: task
  - validate_ai

# Grill may FAIL -> existing Planning -> Grill again at most three times.
# There is no dedicated Repair Stage. The third FAIL is accepted and the workflow continues.
stages:
  planning:
    type: plan

  grill:
    type: review
    prompt: ../../runner/prompts/stages/grill.md
    fresh_session_on_start: true
    retry: 0
    recover: [planning]
    max_attempts: 3
    on_exhausted: continue

  validate_ai:
    type: ai_validator
    validator: ai
    restart_at: planning

flow:
  - planning
  - grill
  - validate_ai

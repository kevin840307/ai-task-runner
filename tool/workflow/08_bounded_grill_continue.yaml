# Grill may FAIL -> Planning -> Grill again at most three times.
# The third FAIL is accepted and the workflow continues to final validation.
# If a later routing step brings execution back to Grill, the counter starts at 1 again.
stages:
  planning:
    type: plan

  grill:
    type: review
    prompt: ../../runner/prompts/stages/grill.md
    fresh_session_on_start: true
    retry: 0
    recover: [planning]
    max_attempts: 3
    on_exhausted: continue

  planning:
    type: plan
    planning: true
    fresh_session_on_start: true

  validate_ai:
    type: ai_validator
    validator: ai
    recover: [planning]

flow:
  - planning
  - grill
  - validate_ai

# Grill may FAIL -> Repair Plan -> Grill again at most three times.
# The third FAIL is accepted and the workflow continues to final validation.
# If a later routing step brings execution back to Grill, the counter starts at 1 again.
stages:
  planning:
    type: plan

  execute:
    type: task

  review:
    type: review
    recover: [repair]

  repair:
    type: task

  grill:
    type: review
    prompt: ../../runner/prompts/stages/grill.md
    fresh_session_on_start: true
    retry: 0
    recover: [repair_plan]
    max_attempts: 3
    on_exhausted: continue

  repair_plan:
    type: plan
    repair_plan: true
    fresh_session_on_start: true

  validate_ai:
    type: ai_validator
    validator: ai
    recover: [repair_plan]

flow:
  - planning
  - grill
  - validate_ai

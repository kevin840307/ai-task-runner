stages:
  planning:
    type: plan



  preflight_file:
    type: command
    result_kind: validation
    command: ["{python}", -c, "print('PREFLIGHT_PASS')"]
    routes:
      fail: planning

  challenge_review:
    type: base
    profile: review
    prompt: common/review.md
    session_policy: fresh
    routes:
      fail: planning

  ai_gate_1:
    type: ai_validator
    validator: ai
    routes:
      fail: planning

  post_file:
    type: command
    result_kind: validation
    command: ["{python}", -c, "print('POST_FILE_PASS')"]
    routes:
      fail: planning

  ai_gate_2:
    type: ai_validator
    validator: ai
    routes:
      fail: planning

  final_note:
    type: command
    command: ["{python}", -c, "print('WORKFLOW_DONE')"]

flow:
  - planning
  - preflight_file
  - challenge_review
  - ai_gate_1
  - post_file
  - ai_gate_2
  - final_note

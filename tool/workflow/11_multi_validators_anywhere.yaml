stages:
  planning:
    type: plan

  execute:
    type: task
    scope: task

  review:
    type: review
    scope: task
    routes:
      fail: execute

  preflight_file:
    type: command
    result_kind: validation
    command: ["{python}", -c, "print('PREFLIGHT_PASS')"]
    routes:
      fail: planning

  grill:
    type: review
    prompt: ../../runner/workflows/grill.md
    fresh_session_on_start: true
    routes:
      fail: planning

  ai_gate_1:
    type: ai_validator
    validator: ai
    routes:
      fail: planning

  post_file:
    type: command
    result_kind: validation
    command: ["{python}", -c, "print('POST_FILE_PASS')"]
    routes:
      fail: planning

  ai_gate_2:
    type: ai_validator
    validator: ai
    routes:
      fail: planning

  final_note:
    type: command
    command: ["{python}", -c, "print('WORKFLOW_DONE')"]

flow:
  - planning
  - execute
  - review
  - preflight_file
  - grill
  - ai_gate_1
  - post_file
  - ai_gate_2
  - final_note

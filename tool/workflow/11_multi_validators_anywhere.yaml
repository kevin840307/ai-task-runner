# Multiple File/AI validators can be placed anywhere in the top-level flow.
# Every semantic FAIL routes directly back to the existing Planning Stage.
stages:
  planning:
    type: plan

  preflight_file:
    type: command
    result_kind: validation
    command: ["{python}", -c, "print('PREFLIGHT_PASS')"]

  grill:
    type: review
    prompt: ../../runner/prompts/stages/grill.md
    fresh_session_on_start: true

  ai_gate_1:
    type: ai_validator
    validator: ai

  post_file:
    type: command
    result_kind: validation
    command: ["{python}", -c, "print('POST_FILE_PASS')"]

  ai_gate_2:
    type: ai_validator
    validator: ai

  final_note:
    type: command
    command: ["{python}", -c, "print('WORKFLOW_DONE')"]

flow:
  - planning
  - stage: preflight_file
    restart_at: planning
  - stage: grill
    restart_at: planning
  - stage: ai_gate_1
    restart_at: planning
  - stage: post_file
    restart_at: planning
  - stage: ai_gate_2
    restart_at: planning
  - final_note

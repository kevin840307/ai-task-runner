# Whole-result Grill before final AI validation.
# Grill reuses ReviewStage + review output contract; no GrillStage or Repair Stage exists.
stages:
  planning:
    type: plan

  grill:
    type: review
    prompt: ../../runner/prompts/stages/grill.md
    fresh_session_on_start: true
    retry: 0
    recover: [planning]

  validate_ai:
    type: ai_validator
    validator: ai
    restart_at: planning

flow:
  - planning
  - grill
  - validate_ai

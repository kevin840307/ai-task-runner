stages:
  planning:
    type: plan

  execute:
    type: task

  review:
    type: review
    routes:
      fail: execute

  grill:
    type: review
    prompt: ../../runner/prompts/stages/grill.md
    fresh_session_on_start: true
    retry: 0
    routes:
      fail: planning

  validate_ai:
    type: ai_validator
    validator: ai
    routes:
      fail: planning

flow:
  - planning
  - stage: execute
    scope: task
  - stage: review
    scope: task
  - grill
  - validate_ai

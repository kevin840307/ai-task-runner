# Advanced example: a command creates Task[] instead of PlanStage.
# The task-scoped execute/review lifecycle is explicit here.
stages:
  discover_tasks:
    type: command
    command: "{python} custom_task_producer.py"
    produces: tasks

  execute:
    type: task

  review:
    type: review
    recover: [repair]

  repair:
    type: task

  done:
    type: command
    command: ["{python}", -c, "print('CUSTOM_WORKFLOW_PASS')"]

flow:
  - discover_tasks
  - stage: execute
    scope: task
  - stage: review
    scope: task
  - done

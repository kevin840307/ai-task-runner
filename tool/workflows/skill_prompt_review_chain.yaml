stages:
  run_prompt:
    type: task

  review:
    type: review

  validate_file:
    type: command
    result_kind: validation
    command: "{python} {validator} --project-root {project_root} --state-file {state_file} {validator_args}"
    recover:
      - stage: run_prompt
        prompt: prompts/fix_validation.md
      - stage: review
        prompt: prompts/review_validation_fix.md

flow:
  - stage: run_prompt
    prompt: prompts/design.md

  - stage: review
    prompt: prompts/review_design.md

  - stage: run_prompt
    prompt: prompts/implementation.md

  - stage: review
    prompt: prompts/review_implementation.md

  - stage: run_prompt
    prompt: prompts/documentation.md

  - stage: review
    prompt: prompts/review_documentation.md

  - validate_file

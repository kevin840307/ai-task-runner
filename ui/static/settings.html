<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Settings · AI Task Runner</title><link rel="stylesheet" href="/styles.css">
<style>
body{display:block;width:100%;height:100vh;overflow:hidden}
.settings-shell{min-height:100vh;display:grid;grid-template-columns:76px 210px minmax(0,1fr);background:var(--surface,#f7f8fa);color:var(--text,#18202a)}
.settings-shell.context-collapsed{grid-template-columns:76px 64px minmax(0,1fr)}.settings-shell.context-collapsed .settings-nav>:not(#toggleSettingsContext){display:none}.settings-global,.settings-nav{padding:16px 10px;border-right:1px solid #b9c2cb;display:flex;flex-direction:column;gap:12px}.settings-global a,.settings-nav a{padding:9px;border-radius:8px}.settings-global a{text-align:center}.settings-global .legacy-link{margin-top:auto;font-size:.78rem}
.settings-main{padding:24px;max-width:760px;min-width:0}.settings-main h1,.settings-main p,.settings-card{overflow-wrap:anywhere}.settings-card{border:1px solid #b9c2cb;border-radius:12px;padding:18px;display:grid;gap:16px}.settings-row{display:grid;grid-template-columns:180px minmax(0,1fr);gap:12px;align-items:center}.settings-row select{padding:9px}
@media(max-width:700px){body{height:auto;min-height:100vh;overflow:auto}.settings-shell,.settings-shell.context-collapsed{grid-template-columns:1fr}.settings-shell.context-collapsed .settings-nav>:not(#toggleSettingsContext){display:revert}.settings-global,.settings-nav{border-right:0;border-bottom:1px solid #b9c2cb;flex-direction:row;flex-wrap:wrap}.settings-global .legacy-link{margin-top:0;margin-left:auto}.settings-row{grid-template-columns:1fr}}
</style>
</head><body>
<div class="settings-shell">
<nav class="settings-global" aria-label="Global navigation">
<a href="/chats.html" data-i18n="workspace.chats">Chats</a><a href="/library.html" data-i18n="workspace.library">Library</a><a href="/settings.html" aria-current="page" data-i18n="workspace.settings">Settings</a><a class="legacy-link" href="/" data-i18n="workspace.legacy">Legacy</a>
</nav>
<aside class="settings-nav" aria-label="Settings context">
<button id="toggleSettingsContext" type="button" aria-expanded="true" title="Collapse Settings sidebar">☰</button>
<strong data-i18n="settings.title">Settings</strong><a href="#interface" aria-current="page" data-i18n="settings.interface">Interface</a>
</aside>
<main class="settings-main">
<h1 data-i18n="settings.title">Settings</h1>
<p data-i18n="settings.desc">Interface preferences only. Runner, Workflow and Task execution settings stay with their existing owners.</p>
<section id="interface" class="settings-card">
<label class="settings-row"><span data-i18n="settings.appearance">Appearance</span> <select id="appearance"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
<label class="settings-row"><span data-i18n="settings.accent">Accent</span> <select id="theme"><option value="teal">Teal</option><option value="blue">Deep Blue</option><option value="violet">Violet</option><option value="amber">Amber</option><option value="rose">Rose</option></select></label>
<label class="settings-row"><span data-i18n="settings.motion">Motion</span> <select id="motion"><option value="full">Full</option><option value="system">System</option><option value="reduced">Reduced</option></select></label>
<label class="settings-row"><span data-i18n="settings.language">Language</span> <select id="language"><option value="zh-TW">繁體中文</option><option value="en">English</option></select></label>
<p id="settingsStatus" role="status"></p>
</section>
</main></div>
<script src="/js/i18n.js"></script>
<script type="module" src="/js/settings.js"></script>
</body></html>

<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Library · AI Task Runner</title><link rel="stylesheet" href="/styles.css">
<style>
.library-shell{min-height:100vh;display:grid;grid-template-columns:220px minmax(0,1fr);background:var(--surface,#f7f8fa);color:var(--text,#18202a)}
.library-nav{padding:20px;border-right:1px solid #b9c2cb;display:flex;flex-direction:column;gap:12px}.library-nav a{padding:9px;border-radius:8px}
.library-main{padding:24px;min-width:0}.library-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.library-controls{display:flex;gap:8px;flex-wrap:wrap}.library-controls input,.library-controls select,.library-controls button{padding:9px}
.asset-list{display:grid;margin-top:16px;border:1px solid #b9c2cb;border-radius:10px;overflow:hidden}.asset-row{display:grid;grid-template-columns:minmax(180px,1fr) minmax(120px,220px) minmax(110px,160px);gap:12px;text-align:left;padding:12px;border:0;border-bottom:1px solid #ccd3da;background:transparent;cursor:pointer}.asset-row:last-child{border-bottom:0}.asset-row strong,.asset-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.asset-empty{padding:32px;text-align:center}.library-tabs{display:flex;gap:8px;margin-top:18px}.library-tabs button{padding:9px 14px}.library-tabs button[aria-selected=true]{font-weight:700;outline:2px solid currentColor}
@media(max-width:700px){.library-shell{grid-template-columns:1fr}.library-nav{border-right:0;border-bottom:1px solid #b9c2cb;flex-direction:row;flex-wrap:wrap}.asset-row{grid-template-columns:1fr}.asset-row span{white-space:normal}}
</style>
</head>
<body>
<div class="library-shell">
<nav class="library-nav" aria-label="Global navigation">
  <strong>AI Task Runner</strong>
  <a href="/chats.html">Chats</a>
  <a href="/library.html" aria-current="page">Library</a>\n  <a href="/settings.html">Settings</a>
  <a href="/">Legacy workspace</a>
</nav>
<main class="library-main">
  <div class="library-head">
    <div><h1>Library</h1><p>Reusable Workflow and Prompt assets. Scope is explicit and is not inherited from the selected Chat.</p></div>
    <div class="library-controls">
      <label>Scope <select id="libraryScope"><option value="">Global</option></select></label>
      <input id="librarySearch" type="search" placeholder="Search assets…" aria-label="Search assets">
    </div>
  </div>
  <div class="library-tabs" role="tablist">
    <button id="workflowLibraryTab" role="tab" aria-selected="true">Workflows</button>
    <button id="promptLibraryTab" role="tab" aria-selected="false">Prompts</button>
  </div>
  <div id="libraryStatus" role="status"></div>
  <div id="assetList" class="asset-list"></div>
</main>
</div>
<script type="module" src="/js/library.js"></script>
</body></html>

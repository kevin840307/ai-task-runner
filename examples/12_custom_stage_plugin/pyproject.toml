[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-task-runner-echo-stage-example"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["ai-task-runner"]

[project.entry-points."ai_task_runner.plugins"]
echo_stage_example = "echo_stage_plugin"

[tool.setuptools.packages.find]
where = ["src"]

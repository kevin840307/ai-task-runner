stages:
  run_prompt:
    status: AI running prompt
    run_state: executing
    mode: write
    actor: executor
    track_changes: true

  review:
    status: AI reviewing stage result
    run_state: reviewing
    mode: readonly
    actor: ai
    backend_mode: review
    parser: review
    result_status: completed
    result_handler: review
    retry_attr: review_retries
    skip_on_error: true

  validate_file:
    type: python
    validator: file
    status: Running File Validator
    run_state: validating
    mode: write
    actor: validator
    result_handler: validation

flow:
  - stage: run_prompt
    prompt: prompts/design.md

  - stage: review
    prompt: prompts/review_design.md

  - stage: run_prompt
    prompt: prompts/implementation.md

  - stage: review
    prompt: prompts/review_implementation.md

  - stage: run_prompt
    prompt: prompts/documentation.md

  - stage: review
    prompt: prompts/review_documentation.md

  - validate_file

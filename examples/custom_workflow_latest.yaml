# Custom task producer with an explicit per-task closed loop.
stages:
  discover_tasks:
    type: command
    command: "{python} custom_task_producer.py"
    produces: tasks

  execute:
    type: task

  review:
    type: review
    routes:
      fail: execute

  done:
    type: command
    command: ["{python}", -c, "print('CUSTOM_WORKFLOW_PASS')"]

flow:
  - discover_tasks
  - stage: execute
    scope: task
  - stage: review
    scope: task
  - done

stages:
  step_a:
    type: base
    mode: write
    actor: executor
    track_changes: true
    prompt: prompts/step_a.md

  review_a:
    type: review
    prompt: prompts/review_a.md
    routes:
      fail: step_a

  step_b:
    type: base
    mode: write
    actor: executor
    track_changes: true
    prompt: prompts/step_b.md

  review_b:
    type: review
    prompt: prompts/review_b.md
    routes:
      fail: step_b

  step_c:
    type: base
    mode: write
    actor: executor
    track_changes: true
    prompt: prompts/step_c.md

  validate_file:
    type: command
    result_kind: validation
    command: "{python} {validator} --project-root {project_root} --state-file {state_file} {validator_args}"

flow:
  - step_a
  - review_a
  - step_b
  - review_b
  - step_c
  - validate_file

stages:
  run_prompt:
    status: AI 正在執行 Prompt
    run_state: executing
    mode: write
    actor: executor
    track_changes: true

  review:
    status: AI 正在執行 Review
    run_state: reviewing
    mode: readonly
    actor: ai
    backend_mode: review
    parser: review
    result_status: completed

  validate_file:
    type: python
    validator: file
    status: 正在執行 File Validator
    run_state: validating
    mode: write
    actor: validator
    result_handler: validation

flow:
  - stage: run_prompt
    prompt: prompts/step_a.md

  - stage: review
    prompt: prompts/review_a.md
    retry: 1
    skip: true

  - stage: run_prompt
    prompt: prompts/step_b.md

  - stage: review
    prompt: prompts/review_b.md
    skip: false

  - stage: run_prompt
    prompt: prompts/step_c.md

  - validate_file

stages:
  run_prompt:
    type: task

  review:
    type: review
    continuation_prompt: skills/review_continue.md
    skip_on_error: false

  grill_ai:
    type: review
    session_key: grill_client
    continuation_prompt: skills/grill_continue.md
    skip_on_error: false

  final_validate:
    type: ai_validator
    validator: ai
    session_key: final_validation_client
    fresh_session_each_run: true
    runs: 5
    required_passes: 3
    structured_retries: 2
    retry: -1
    prompt: skills/final_validation.md
    recover:
      - stage: run_prompt
        label: Fix Current Result
        prompt: skills/fix.md


flow:
  # 1. Project Discovery
  - stage: run_prompt
    label: Project Discovery
    prompt: skills/project_discovery.md

  - stage: review
    label: Review Project Discovery
    prompt: skills/review.md
    instructions: Review project discovery.
    recover:
      - stage: run_prompt
        label: Fix Current Result
        prompt: skills/fix.md


  # 2. Project Documentation
  - stage: run_prompt
    label: Project Documentation
    prompt: skills/project_documentation.md

  - stage: grill_ai
    label: Grill Project Documentation
    prompt: skills/grill.md
    repeat: 3
    instructions: >-
      Check only these required demo documentation items: how to run the sample, supported calculator operations, expected normal behavior, and important observable errors. PASS if these are materially correct and sufficient; do not request unrelated production or enterprise topics.
    recover:
      - stage: run_prompt
        label: Fix Current Result
        prompt: skills/fix.md

  - stage: review
    label: Review Project Documentation
    prompt: skills/review.md
    instructions: Review the project documentation.
    recover:
      - stage: run_prompt
        label: Fix Current Result
        prompt: skills/fix.md


  # 3. E2E SPEC Generation
  - stage: run_prompt
    label: E2E SPEC Generation
    prompt: skills/e2e_spec_generation.md

  - stage: grill_ai
    label: Grill E2E SPEC
    prompt: skills/grill.md
    repeat: 3
    instructions: >-
      Check only these required demo E2E items: concrete normal arithmetic cases plus important calculator boundary/error behavior visible in the project, including divide-by-zero and unsupported operation behavior when applicable. PASS if these are materially covered; do not expand scope.
    recover:
      - stage: run_prompt
        label: Fix Current Result
        prompt: skills/fix.md

  - stage: review
    label: Review E2E SPEC
    prompt: skills/review.md
    instructions: Review the E2E specification.
    recover:
      - stage: run_prompt
        label: Fix Current Result
        prompt: skills/fix.md


  # 4. Verification Design
  - stage: run_prompt
    label: Verification Design
    prompt: skills/verification_design.md

  - stage: review
    label: Review Verification Design
    prompt: skills/review.md
    instructions: Review the verification design.
    recover:
      - stage: run_prompt
        label: Fix Current Result
        prompt: skills/fix.md


  # 5. Regression DSL Generation
  - stage: run_prompt
    label: Regression DSL Generation
    prompt: skills/regression_dsl_generation.md

  - stage: review
    label: Review Regression DSL
    prompt: skills/review.md
    instructions: Review the generated regression DSL.
    recover:
      - stage: run_prompt
        label: Fix Current Result
        prompt: skills/fix.md


  # 6. Regression Execution & Qualification
  - stage: run_prompt
    label: Regression Execution & Qualification
    prompt: skills/execution_qualification.md

  - stage: review
    label: Review Execution & Qualification
    prompt: skills/review.md
    instructions: Review the regression execution and qualification result.
    recover:
      - stage: run_prompt
        label: Fix Current Result
        prompt: skills/fix.md


  # Final 5-agent vote
  - stage: final_validate
    label: Final AI Validation
name: Repair upload then validate

on:
  push:
    branches: [chatgpt-sync]
    paths:
      - '.github/workflows/repair-upload-then-validate.yml'

permissions:
  contents: write

jobs:
  repair-upload-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-sync
          fetch-depth: 0

      - name: Restore missing UI modules and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import ast
          import re
          import subprocess

          BASE = 'de830ab77e8b5a2487ef5fc9130540c7a8f5e6e3'

          def git_show(path: str) -> str:
              return subprocess.check_output(['git', 'show', f'{BASE}:{path}'], text=True)

          # ---- server support ----
          Path('ui/server_support.py').write_text('''from __future__ import annotations

          import ipaddress
          import os
          import subprocess


          def background_process_kwargs() -> dict:
              """Launch long-running UI child processes without opening a console window."""
              kwargs: dict = {
                  "stdin": subprocess.DEVNULL,
                  "stdout": subprocess.DEVNULL,
                  "stderr": subprocess.DEVNULL,
                  "close_fds": True,
              }
              if os.name == "nt":
                  flags = (
                      getattr(subprocess, "CREATE_NEW_PROCESS_GROUP", 0)
                      | getattr(subprocess, "CREATE_NO_WINDOW", 0)
                  )
                  if flags:
                      kwargs["creationflags"] = flags
                  try:
                      startup = subprocess.STARTUPINFO()
                      startup.dwFlags |= getattr(subprocess, "STARTF_USESHOWWINDOW", 0)
                      startup.wShowWindow = getattr(subprocess, "SW_HIDE", 0)
                      kwargs["startupinfo"] = startup
                  except AttributeError:
                      pass
              else:
                  kwargs["start_new_session"] = True
              return kwargs


          def is_loopback_host(host: str) -> bool:
              value = str(host or "").strip().lower()
              if value == "localhost":
                  return True
              try:
                  return ipaddress.ip_address(value).is_loopback
              except ValueError:
                  return False


          __all__ = ["background_process_kwargs", "is_loopback_host"]
          ''', encoding='utf-8')

          # ---- Workflow Builder server mixin: recover the last known-good inline methods ----
          src = git_show('ui/server.py')
          lines = src.splitlines(True)
          tree = ast.parse(src)
          cls = next(node for node in tree.body if isinstance(node, ast.ClassDef) and node.name == 'UIState')
          names = {
              '_builder_root', '_builder_active_path', '_builder_set_active', '_builder_clear_active',
              '_builder_active_job_id', '_builder_job_root', '_tail_text', 'studio_draft_info',
              'studio_generate_workflow', 'studio_generate_active', '_builder_paths', '_builder_visual',
              '_builder_preview', '_builder_apply_edits', '_builder_validate_draft',
              'studio_generate_status', 'studio_generate_validate', 'studio_generate_save',
              'studio_generate_cancel', 'studio_generate_discard',
          }
          funcs = [node for node in cls.body if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in names]
          funcs.sort(key=lambda node: node.lineno)
          chunks = []
          for node in funcs:
              starts = [node.lineno] + [decorator.lineno for decorator in node.decorator_list]
              chunks.append(''.join(lines[min(starts)-1:node.end_lineno]) + '\n')
          header = '''from __future__ import annotations

          import json
          import os
          import re
          import shutil
          import sys
          import time
          import uuid
          from pathlib import Path

          import yaml

          try:
              from .workflow_storage import project_package_prompt_dir, project_package_workflow_dir
              from .server_support import background_process_kwargs
          except ImportError:
              from workflow_storage import project_package_prompt_dir, project_package_workflow_dir
              from server_support import background_process_kwargs

          RUNTIME_DIR = ".ai-task-runner"


          class WorkflowBuilderMixin:
          '''
          mixin = header + ''.join(chunks) + '\n\n__all__ = ["WorkflowBuilderMixin"]\n'
          mixin = mixin.replace('with self._lifecycle_lock:', 'with self._builder_lock:')
          mixin = mixin.replace(
              'with self._builder_lock:\n            info = self._builder_paths',
              'with self._builder_lock, self._edit_lock:\n            info = self._builder_paths',
          )
          mixin = mixin.replace('kwargs = _background_process_kwargs()', 'kwargs = background_process_kwargs()')
          mixin = mixin.replace('subprocess.Popen(', 'self._process_module.Popen(')
          mixin = mixin.replace('subprocess.DEVNULL', 'self._process_module.DEVNULL')
          mixin = mixin.replace('subprocess.run(', 'self._process_module.run(')
          Path('ui/workflow_builder_state.py').write_text(mixin, encoding='utf-8')

          # ---- Browser Workflow Generator module ----
          START = '// ------------------------------ AI Workflow Builder page ------------------------------'
          END = '// ------------------------------ Add Project modal ------------------------------'
          base_app = git_show('ui/static/app.js')
          start = base_app.index(START)
          end = base_app.index(END)
          block = base_app[start:end]
          body = block.split('\n', 1)[1]
          fn_names = re.findall(r'^(?:async\s+)?function\s+([A-Za-z0-9_$]+)\s*\(', body, re.M)
          module = '''export function createWorkflowGenerator(deps) {
            const {
              state, $, api, showToast, showActionError, confirmDialog, confirmDiscardStudio,
              renderStudioFiles, renderWorkflowPicker, renderStudioPanels, refreshStudioFiles,
              applyStudioGuardToDialogs, refreshStudioGuard, openStudioFile
            } = deps;

          ''' + ''.join('  ' + line if line.strip() else line for line in body.splitlines(True)) + '''
            return {
          ''' + ''.join(f'    {name},\n' for name in fn_names) + '''  };
          }
          '''
          Path('ui/static/js/workflow-generator.js').write_text(module, encoding='utf-8')

          current = Path('ui/static/app.js').read_text(encoding='utf-8')
          start = current.index(START)
          if current[max(0, start-3):start] == 'fun':
              start -= 3
          end = current.index(END)
          factory = START + '\nconst {\n' + ''.join(f'  {name},\n' for name in fn_names) + ''' } = createWorkflowGenerator({
            state, $, api, showToast, showActionError, confirmDialog, confirmDiscardStudio,
            renderStudioFiles, renderWorkflowPicker, renderStudioPanels, refreshStudioFiles,
            applyStudioGuardToDialogs, refreshStudioGuard, openStudioFile,
          });

          '''
          current = current[:start] + factory + current[end:]
          import_line = 'import { createWorkflowGenerator } from "./js/workflow-generator.js";\n'
          if import_line not in current:
              pos = current.find('\n') + 1
              current = current[:pos] + import_line + current[pos:]
          Path('ui/static/app.js').write_text(current, encoding='utf-8')

          # ---- deterministic long-path regression coverage ----
          Path('tests/test_long_path_runtime.py').write_text('''from pathlib import Path

          from runner.resources import read_text, write_text
          from runner.runtime.run_state import RunState, StateStore
          from runner.utils.files import copy_path, digest, remove_path
          from runner.workflow.snapshot import freeze_run_resource, load_run_resource


          def _deep_root(tmp_path: Path) -> Path:
              root = tmp_path
              for index in range(7):
                  root = root / (f"segment-{index}-" + "x" * 38)
              root.mkdir(parents=True)
              assert len(str(root)) > 300
              return root


          def test_core_runtime_io_supports_deep_project_paths(tmp_path: Path):
              root = _deep_root(tmp_path)
              source = root / "source.txt"
              write_text(source, "deep")
              assert read_text(source)[0] == "deep"
              copied = root / "nested" / "copy.txt"
              copy_path(source, copied)
              assert digest(copied) == digest(source)
              remove_path(copied)
              assert not copied.exists()
              work = root / ".ai-task-runner"
              store = StateStore(root, work)
              state = RunState(run_id="run", goal="goal", project_root=str(root))
              store.save(state)
              resumed = store.load_or_create("", resume=True, force_new=False)
              assert resumed.run_id == "run"


          def test_frozen_run_resource_supports_deep_project_paths(tmp_path: Path):
              root = _deep_root(tmp_path)
              source = root / "prompt.md"
              write_text(source, "goal")
              frozen = freeze_run_resource(source, root, ".ai-task-runner", "goal")
              assert frozen is not None
              loaded = load_run_resource(root, ".ai-task-runner", "goal")
              assert loaded is not None and loaded[1] == "goal"
          ''', encoding='utf-8')

          Path('tests/test_readonly_snapshot_cache.py').write_text('''from pathlib import Path
          from types import SimpleNamespace

          from runner.plugins.safety import SafetyHook


          class _SafetyHook(SafetyHook):
              def _protected(self, root: Path):
                  return []


          def _context(root: Path, mode: str, actor: str = "ai"):
              work = root / ".ai-task-runner"
              work.mkdir(parents=True, exist_ok=True)
              return SimpleNamespace(root=root, work=work, mode=mode, actor=actor)


          def test_readonly_snapshot_is_reused_and_restores_mutation(tmp_path: Path):
              root = tmp_path / "project"
              root.mkdir()
              target = root / "value.txt"
              target.write_text("before", encoding="utf-8")
              hook = _SafetyHook()
              first = hook.before_execution(_context(root, "readonly", "review"))
              backup = first.backup
              assert backup is not None and backup.is_dir()
              target.write_text("mutated", encoding="utf-8")
              violations = hook.after_execution(_context(root, "readonly", "review"), first)
              assert target.read_text(encoding="utf-8") == "before"
              assert violations and violations[0].kind == "readonly"
              second = hook.before_execution(_context(root, "readonly", "validator"))
              assert second.backup == backup
              hook.after_execution(_context(root, "readonly", "validator"), second)


          def test_writable_stage_incrementally_updates_reused_readonly_baseline(tmp_path: Path):
              root = tmp_path / "project"
              root.mkdir()
              target = root / "value.txt"
              target.write_text("v1", encoding="utf-8")
              hook = _SafetyHook()
              token = hook.before_execution(_context(root, "readonly", "review"))
              hook.after_execution(_context(root, "readonly", "review"), token)
              write = hook.before_execution(_context(root, "write", "task"))
              target.write_text("v2", encoding="utf-8")
              assert hook.after_execution(_context(root, "write", "task"), write) == []
              readonly = hook.before_execution(_context(root, "readonly", "review"))
              target.write_text("bad", encoding="utf-8")
              hook.after_execution(_context(root, "readonly", "review"), readonly)
              assert target.read_text(encoding="utf-8") == "v2"
          ''', encoding='utf-8')
          PY

      - name: Rebuild project.bundle.txt
        shell: bash
        run: |
          set -euo pipefail
          python tool/bundle.py pack . project.bundle.txt \
            --exclude '.git/**' --exclude '.github/**' --exclude 'project.bundle.txt' \
            --exclude '**/__pycache__/**' --exclude '**/*.pyc' --exclude '**/*.pyo' \
            --exclude '**/.pytest_cache/**' --exclude '**/.ruff_cache/**' --exclude '**/.mypy_cache/**' \
            --exclude '**/qa_evidence/**' --exclude '**/screenshots/**' --exclude '**/test-results/**' \
            --exclude '**/playwright-report/**' --exclude '**/htmlcov/**' --exclude '**/.coverage' \
            --exclude '**/coverage.xml' --exclude '**/junit*.xml' --exclude '**/*.log' \
            --exclude '**/.ai-task-runner/**' --exclude 'ui/data/workflow-builder/**'
          python tool/bundle.py verify project.bundle.txt

      - name: Upload repaired source and refreshed bundle first
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore UI modules and long-path regressions"
          git push origin HEAD:chatgpt-sync

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile and JavaScript syntax checks
        run: |
          python -m compileall -q runner ui tool workflow_builder ai_task_runner.py ai_task_runner_validator.py
          node --check ui/static/app.js
          find ui/static/js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: System workflow dry-run matrices
        run: |
          python tool/workflow_dryrun.py runner/workflow/system/ai.yaml --matrix
          python tool/workflow_dryrun.py runner/workflow/system/file.yaml --matrix
          python tool/workflow_dryrun.py runner/workflow/system/mixed.yaml --matrix

      - name: Critical runner regression suite
        run: |
          python -m pytest -q \
            tests/test_long_path_runtime.py tests/test_readonly_snapshot_cache.py \
            tests/test_planning_loop_policy.py tests/test_project_policy.py \
            tests/test_live_reliability_tool.py tests/test_stage_specialization.py \
            tests/test_runtime_hardening.py tests/test_recovery_policy.py \
            tests/test_runtime_controls.py tests/test_prompt_contracts.py \
            tests/test_immutable_prompt_protocols.py

      - name: UI regression suite
        run: |
          python -m pytest -q \
            ui/tests/test_static_contract.py ui/tests/test_ui.py \
            ui/tests/test_project_workflow_storage.py ui/tests/test_workflow_folder_package.py \
            ui/tests/test_workflow_graph.py ui/tests/test_flow_map_layout_contract.py

      - name: Verify uploaded bundle contract
        run: python tool/bundle.py verify project.bundle.txt

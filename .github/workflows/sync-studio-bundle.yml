name: One-time Studio bundle sync

on:
  push:
    branches:
      - minimal-closed-loop-runtime
    paths:
      - .github/workflows/sync-studio-bundle.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: minimal-closed-loop-runtime
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/studio-src/package-lock.json
      - name: Build Studio
        working-directory: ui/studio-src
        run: |
          npm ci
          npm run build
      - name: Commit generated bundle
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ui/static/workflow-studio-app
          if git diff --cached --quiet; then
            echo "Studio bundle already synchronized"
            exit 0
          fi
          git commit -m "Sync generated Studio bundle"
          git push origin HEAD:minimal-closed-loop-runtime

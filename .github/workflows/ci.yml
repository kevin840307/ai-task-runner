name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile
        run: python -m compileall -q runner tool ai_task_runner.py ai_task_runner_validator.py

      - name: Test
        run: python -m pytest -q

  studio-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/studio-src

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/studio-src/package-lock.json

      - name: Install Studio
        run: npm install

      - name: Build Studio
        run: npm run build


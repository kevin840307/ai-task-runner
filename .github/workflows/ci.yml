name: Temporary Bundle Sync

on:
  push:
    branches:
      - bundle-sync-temp-20261003

permissions:
  contents: write

jobs:
  bundle-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate final source bundle
        run: |
          git worktree add --detach /tmp/ai-task-runner-final 7ebecde2f0ae23969bb673052ed478a00c887ddb
          python3 /tmp/ai-task-runner-final/tool/bundle.py pack /tmp/ai-task-runner-final /tmp/ai-task-runner-final/project.bundle.txt
          cp /tmp/ai-task-runner-final/project.bundle.txt project.bundle.txt

      - name: Restore final CI and commit only bundle
        run: |
          git checkout 7ebecde2f0ae23969bb673052ed478a00c887ddb -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project.bundle.txt .github/workflows/ci.yml
          git commit -m "Regenerate project.bundle.txt from final verified source"
          git push origin HEAD:bundle-sync-temp-20261003

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile
        run: python -m compileall -q runner tool ai_task_runner.py ai_task_runner_validator.py

      - name: Test
        run: python -m pytest -q

  studio-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/studio-src

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/studio-src/package-lock.json

      - name: Install Studio
        run: |
          npm ci
          ROLLUP_VERSION=$(node -p "require('./node_modules/rollup/package.json').version")
          npm install --no-save "@rollup/rollup-linux-x64-gnu@$ROLLUP_VERSION"

      - name: Build Studio
        run: npm run build

      - name: Verify committed Studio bundle
        run: git diff --exit-code -- ../static/workflow-studio-app

      - name: Upload Studio build artifact
        uses: actions/upload-artifact@v4
        with:
          name: workflow-studio-app
          path: ui/static/workflow-studio-app
          if-no-files-found: error


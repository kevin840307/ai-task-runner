name: ChatGPT execution mode final verification
on:
  push:
    branches: [chatgpt-validation]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Targeted architecture and compatibility
        run: >
          python -m pytest -q
          tests/test_execution_modes.py
          tests/test_architecture.py
          tests/test_integration_api.py
          tests/test_stage_extension_contract.py
          tests/test_workflow_dryrun_tool.py
          tests/test_visual_ui_parameter_coverage.py
          ui/tests/test_workflow_graph.py
          ui/tests/test_static_contract.py
          ui/tests/test_ui.py
      - name: Full pytest
        run: python -m pytest -q
